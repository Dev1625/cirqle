title = "Cirqle secret-scanning policy"

# Start from the full upstream ruleset; this file only narrows it.
[extend]
useDefault = true

# Published, non-secret test vectors. These are matched by the broad
# `generic-api-key` heuristic but carry no credential value, so allowlisting
# them by exact value keeps the scan honest instead of teaching us to ignore
# it. Anything that is not one of these still fails the build.
[allowlist]
description = "Known non-secret fixtures in the test suite"
regexTarget = "match"
regexes = [
  # The published SHA-1 of the literal string "password". The HaveIBeenPwned
  # range API is documented against this digest, so the breach-screening tests
  # assert on it directly.
  '''5BAA61E4C9B93F3F0682250B6CF8331B7EE68FD8''',
  # Fake Gmail idempotency keys used to prove a retry cannot double-send.
  # Real keys are generated at runtime and never committed.
  '''outreach_record_[A-Za-z0-9_]+''',
]
