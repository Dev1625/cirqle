# =========================================================================
# THE ALIASES THE APP ASKS FOR
#
# src/lib/aiConfig.ts maps three semantic tiers to the alias names below:
#   fast      -> gemini-2.5-flash-lite
#   reasoning -> deepseek-v4-flash
#   draft     -> deepseek-v4-pro
#
# The app never names an upstream model. To change what a tier actually runs
# on, change the `model:` line here and restart the proxy — no app rebuild,
# no redeploy of the frontend.
#
# If you rename an alias, three files must agree: this one,
# src/lib/aiConfig.ts, and the `models: [...]` allowlist in
# api/register-user.js (virtual keys are scoped per model; an alias missing
# from that list is rejected at request time).
# =========================================================================
model_list:
  # ---- DeepSeek: the cost-driven default for anything writing prose -------
  #
  # Keep the public alias and upstream model honest: a request for
  # `deepseek-v4-flash` reaches DeepSeek V4 Flash, and a request for
  # `deepseek-v4-pro` reaches DeepSeek V4 Pro.
  - model_name: deepseek-v4-flash
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: "os.environ/DEEPSEEK_API_KEY"

  - model_name: deepseek-v4-pro
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: "os.environ/DEEPSEEK_API_KEY"

  # ---- Google ------------------------------------------------------------
  # Compatibility alias retained for older clients.
  - model_name: gemini-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: "os.environ/GEMINI_API_KEY"

  # Retained so any cached client or older build still resolves. Nothing in
  # the current app requests these preview aliases.
  - model_name: gemini-3-flash-preview
    litellm_params:
      model: gemini/gemini-3-flash-preview
      api_key: "os.environ/GEMINI_API_KEY"

  # The active `fast` tier: bulk structured extraction, tagging and summaries.
  - model_name: gemini-2.5-flash-lite
    litellm_params:
      model: gemini/gemini-2.5-flash-lite
      api_key: "os.environ/GEMINI_API_KEY"

  # Compatibility alias retained for older clients.
  - model_name: gemini-3.1-pro-preview
    litellm_params:
      model: gemini/gemini-3.1-pro-preview
      api_key: "os.environ/GEMINI_API_KEY"

  # ---- OpenAI compatibility aliases (not used by the current web app) -----
  - model_name: gpt-5-mini
    litellm_params:
      model: openai/gpt-5-mini
      api_key: "os.environ/OPENAI_API_KEY"

  - model_name: openai-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: "os.environ/OPENAI_API_KEY"

  - model_name: openai-mini-batch
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: "os.environ/OPENAI_API_KEY"
    model_info:
      mode: batch

general_settings:
  # Master key to perform proxy administrative operations (generate keys, etc.)
  master_key: "os.environ/LITELLM_MASTER_KEY"
  
  # SQLite database configuration via environment variables
  database_url: "os.environ/DATABASE_URL"
  database_connection_timeout: 30
  
  # Redis service connection configurations for tracking spend and rate limits
  redis_host: "os.environ/REDIS_HOST"
  redis_port: "os.environ/REDIS_PORT"
  redis_password: "os.environ/REDIS_PASSWORD"
  
  # Enable high-performance Redis cache for virtual keys validation (reduces DB roundtrips)
  enable_redis_auth_cache: true

litellm_settings:
  # Enable response caching
  cache: true
  cache_params:
    type: redis
    host: "os.environ/REDIS_HOST"
    port: "os.environ/REDIS_PORT"
    password: "os.environ/REDIS_PASSWORD"

router_settings:
  # Automatically retry on rate limits or failures across models
  routing_strategy: simple-shuffle
  set_verbose: true
