# =========================================================================
# THE ALIASES THE APP ASKS FOR
#
# server/api/_lib/ai-feature-policy.js owns each feature's tier, alias, and limits.
# src/lib/aiConfig.ts mirrors the expected browser-side tier aliases:
#   fast      -> gemini-3.5-flash-lite
#   reasoning -> deepseek-v4-flash
#   draft     -> deepseek-v4-pro
#
# The app never names an upstream provider route. This file is the final
# alias-to-provider routing hop loaded by LiteLLM.
#
# If you rename an alias, three files must agree: this one,
# src/lib/aiConfig.ts, and server/api/_lib/ai-feature-policy.js. Managed virtual-key
# allowlists derive from the server policy, so a policy alias missing here is
# rejected at request time.
# =========================================================================
model_list:
  # ---- DeepSeek: reasoning and premium drafting ---------------------------
  #
  # Keep the public alias and upstream model honest: a request for
  # `deepseek-v4-flash` reaches DeepSeek V4 Flash, and a request for
  # `deepseek-v4-pro` reaches DeepSeek V4 Pro.
  - model_name: deepseek-v4-flash
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: "os.environ/DEEPSEEK_API_KEY"

  - model_name: deepseek-v4-pro
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: "os.environ/DEEPSEEK_API_KEY"

  # ---- Google ------------------------------------------------------------
  # The active `fast` tier: structured extraction, tagging, summaries, and
  # quick outreach drafts.
  - model_name: gemini-3.5-flash-lite
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: "os.environ/GEMINI_API_KEY"

general_settings:
  # Master key to perform proxy administrative operations (generate keys, etc.)
  master_key: "os.environ/LITELLM_MASTER_KEY"
  
  # SQLite database configuration via environment variables
  database_url: "os.environ/DATABASE_URL"
  database_connection_timeout: 30
  
  # Redis service connection configurations for tracking spend and rate limits
  redis_host: "os.environ/REDIS_HOST"
  redis_port: "os.environ/REDIS_PORT"
  redis_password: "os.environ/REDIS_PASSWORD"
  
  # Enable high-performance Redis cache for virtual keys validation (reduces DB roundtrips)
  enable_redis_auth_cache: true
  # Keep cost/tier/request metadata for budgets, never private CRM prompts.
  store_prompts_in_spend_logs: false

litellm_settings:
  # Relationship context is private and changes over time. Do not persist
  # prompts/responses in a shared response cache or verbose proxy logs.
  cache: false
  turn_off_message_logging: true
  log_raw_request_response: false
  set_verbose: false
  telemetry: false
  # Gemini 3.x deprecates legacy sampling parameters. LiteLLM must omit a
  # provider-unsupported parameter instead of turning a healthy route into a
  # request-level 400.
  drop_params: true

router_settings:
  # Automatically retry on rate limits or failures across models
  routing_strategy: simple-shuffle
