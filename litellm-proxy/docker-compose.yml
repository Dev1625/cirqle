services:
  # --- State Management & Rate Limiting (Redis) ---
  redis:
    image: redis:7.4.9-alpine3.21@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    container_name: cirqle-proxy-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # --- Core API Proxy (LiteLLM) ---
  litellm-proxy:
    image: ghcr.io/berriai/litellm:v1.92.1@sha256:668d52ba01e47718a6f818ee55a1dfbb83125a8b9dc6b7b206901826c93cf41b
    container_name: cirqle-proxy-gateway
    ports:
      - "4000:4000"
    volumes:
      # Mount configuration file (Read-Only)
      - ./config.yaml:/app/config.yaml:ro
      # Persist SQLite key database locally on the host machine
      - ./data:/data
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - LITELLM_SALT_KEY=${LITELLM_SALT_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - DATABASE_URL=${DATABASE_URL}
    command: ["--config=/app/config.yaml"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # Named persistent volume for Redis data
  redis_data:
